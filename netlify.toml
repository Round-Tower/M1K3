# Netlify deploy config for the M1K3 launch site.
# site/ is a self-contained static site (THREE.js vendored, hero GLB local —
# no CDN, fitting for a "no cloud attached" product).
#
# base = "site" so Netlify runs from inside site/ — which has no package.json,
# so it SKIPS the repo-root package.json's npm install + build (that build is
# what failed the first deploy). There's no build step (static files live
# directly in site/), so publish = "." — resolved relative to base = "site".
[build]
  base = "site"
  publish = "."
  command = ""
  # Skip the build (and the per-PR deploy preview) unless the site itself
  # changed — most pushes here are app/CI work that can't affect m1k3.app.
  # `git diff --quiet` exits 0 on "no changes", which tells Netlify to skip.
  # ⚠️ Netlify runs this from the BASE directory (site/), and git resolves
  # relative pathspecs against cwd — so bare `site/ netlify.toml` pointed at
  # site/site/ and site/netlify.toml (neither exists), matched nothing, and
  # SKIPPED EVERY DEPLOY (2026-07-10 → 07-11: the GEO pages 404'd on prod).
  # The `:/` magic prefix anchors pathspecs to the repo top level, cwd-proof.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':/site' ':/netlify.toml'"

# No CSP yet. The type is self-hosted now (site/fonts.css), so nothing external
# needs whitelisting — a strict CSP is a follow-up; the inline scripts and the
# blob: worker the 3D scene uses need their own allowances first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
