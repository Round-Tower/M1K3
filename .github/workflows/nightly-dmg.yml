name: Nightly DMG

# Builds a signed, notarized, stapled M1K3.dmg from master each night and
# publishes it as a DateVer (CalVer, YYYY.MM.DD) GitHub Release — the off-store /
# Homebrew-cask download path. The newest is marked --latest and the asset has a
# stable name, so the site can hardlink a permanent URL:
#   https://github.com/<owner>/<repo>/releases/latest/download/M1K3.dmg
# Dated releases accumulate as history. Wraps tools/release/release-macos.sh (the
# same script used for manual releases) so CI and local builds stay identical.
#
# ── ONE-TIME SETUP: add these repo secrets (Settings → Secrets and variables → Actions) ──
#   MACOS_DEVELOPER_ID_CERT_P12       base64 of your "Developer ID Application" .p12
#                                     (export from Keychain Access; then: base64 -i cert.p12 | pbcopy)
#   MACOS_DEVELOPER_ID_CERT_PASSWORD  the password you set when exporting that .p12
#   APPLE_NOTARY_APPLE_ID             Apple ID email for notarization (e.g. kevin@round-tower.ie)
#   APPLE_NOTARY_PASSWORD             an app-specific password from appleid.apple.com
#   MACOS_DEVELOPER_ID_PROFILE        base64 of the app's Developer ID provisioning profile, named
#                                     "M1K3" (developer portal: Developer ID, app.m1k3,
#                                     the Developer ID Application cert above; NOT Xcode's managed
#                                     one, which manual signing refuses). Its keychain group is
#                                     what lets the DMG build store anything on macOS 27.
#
# Until those secrets exist the job SKIPS cleanly (it never reddens the Actions
# tab — same philosophy as ci.yml's Slack notify). Once set, it just works.
# Note: on the fresh public repo (2026-07-02) all secrets start absent — this
# file doubles as the checklist for restoring them.

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC nightly
  workflow_dispatch: # and on-demand

concurrency:
  group: nightly-dmg
  cancel-in-progress: true

permissions:
  contents: write # to publish the GitHub Release

env:
  APPLE_TEAM_ID: "76DJH43A4P" # matches TEAM in release-macos.sh (not secret)
  NOTARY_PROFILE: "M1K3-notary" # matches NOTARY_PROFILE in release-macos.sh

jobs:
  dmg:
    name: Build · sign · notarize · publish
    # GitHub's Xcode 27 image (label `xcode-27`, a preview image on macOS 27).
    # release-macos.sh refuses anything but stable Xcode 27.x since 2026-09-15
    # (#338), and the macos-26 image tops out at Xcode 26.6 — so this job failed
    # every night from 09-16 until it moved here. The app links
    # FoundationModels.framework (needs a macOS 26+ runtime — ci.yml's swift-mac
    # comment has the detail); macOS 27 satisfies that. ci.yml stays on macos-26
    # on purpose: it compiles and tests, it does not cut a release artifact.
    #
    # ⚠️ `xcode-27` is a PREVIEW label GitHub may rename or retire on its own
    # schedule. If it stops resolving, this job never starts: it sits queued and
    # ends `cancelled`, not `failure`, and timeout-minutes never fires. When a
    # macos-27 image goes GA, move to it.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight — secrets configured, and anything new to build?
        id: gate
        env:
          CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CERT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set yet — skipping the nightly DMG. See the header of this workflow for the 5 secrets to add."
            exit 0
          fi
          # Scheduled runs skip when master hasn't moved since the last release —
          # a nightly of an already-released commit is 40-60 runner-minutes and a
          # notarization round-trip for a byte-identical artifact. Manual
          # workflow_dispatch always builds (the "prove the pipeline" path).
          # Nightly releases are created with `--target $GITHUB_SHA`, so
          # targetCommitish is a full SHA; a hand-made release may carry a branch
          # name instead, which simply never matches → we build once, and from
          # then on the SHA comparison takes over.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            LAST="$(gh release view --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null || true)"
            if [ "$LAST" = "$GITHUB_SHA" ]; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::notice::master unchanged since the last release ($GITHUB_SHA) — skipping tonight's DMG."
              exit 0
            fi
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 27.0 (pinned — the same toolchain as the store build)
        if: steps.gate.outputs.configured == 'true'
        # Pinned by path, not by "latest": the next Xcode must be a deliberate
        # bump here AND in release-macos.sh's toolchain guard, never a silent
        # one. Xcode_27.0.app is a symlink the image provides; the bundle it
        # points at has moved between images (Xcode_27_Release_Candidate.app on
        # 20260928, Xcode_27.app on 20261006 — same GA build 27A266a, with 27.1
        # and 27.2 beta now installed beside it). release-macos.sh's guard
        # rejects only a path containing "beta", so the symlink passes it.
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Ensure the Metal toolchain (MLX compiles shaders)
        if: steps.gate.outputs.configured == 'true'
        # Xcode 27 ships the Metal toolchain as a separate component; a fresh
        # install has none and the MLX build fails without it. On image
        # 20261006 (2026-10-10) `-downloadComponent` printed "Done downloading"
        # and `metal` still reported missing: the asset lands in
        # /System/Library/AssetsV2 but is never mounted into the selected Xcode.
        # Apple's escape hatch for that is to export the downloaded component to
        # a bundle and import it explicitly, so that is the fallback below.
        run: |
          set -euo pipefail
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present"
            exit 0
          fi
          xcodebuild -downloadComponent MetalToolchain
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain installed"
            exit 0
          fi
          echo "::warning::Metal toolchain downloaded but not mounted — exporting and importing it explicitly"
          EXPORT="$RUNNER_TEMP/metal-export"
          xcodebuild -deleteComponent MetalToolchain || true
          xcodebuild -downloadComponent MetalToolchain -exportPath "$EXPORT"
          BUNDLE="$(find "$EXPORT" -maxdepth 1 -name "MetalToolchain-*.exportedBundle" | head -1)"
          test -n "$BUNDLE"
          xcodebuild -importComponent MetalToolchain -importPath "$BUNDLE"
          xcrun -sdk macosx metal --version

      - name: Install xcodegen + xcbeautify
        if: steps.gate.outputs.configured == 'true'
        run: brew install xcodegen xcbeautify

      - name: Generate M1K3.xcodeproj (pbxproj is gitignored)
        if: steps.gate.outputs.configured == 'true'
        working-directory: macos
        run: xcodegen generate

      - name: Import Developer ID cert into a temporary keychain
        if: steps.gate.outputs.configured == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/m1k3-signing.keychain-db"
          KP="$(uuidgen)"   # ephemeral keychain password
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so codesign/notarytool find it.
          EXISTING="$(security list-keychains -d user | sed 's/[" ]//g')"
          # shellcheck disable=SC2086  # intentional split: each keychain path is its own arg
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning -v "$KEYCHAIN" | grep "Developer ID Application" || {
            echo "❌ No Developer ID Application identity imported"; exit 1; }

      - name: Install the Developer ID provisioning profile
        if: steps.gate.outputs.configured == 'true'
        # The app's keychain-access-groups needs it: macOS 27's keychain refuses a
        # profile-less identity (-34018), so without it the DMG build has no MCP
        # server, no Brain at Home key and no call key (2026-10-09). Fail closed.
        env:
          PROFILE_B64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE }}
        run: |
          set -euo pipefail
          [ -n "$PROFILE_B64" ] || { echo "❌ MACOS_DEVELOPER_ID_PROFILE is not set — see this workflow's header"; exit 1; }
          PROFILE="$RUNNER_TEMP/m1k3-direct.provisionprofile"
          umask 077
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"
          UUID="$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)"
          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw -)"
          # A wrong or rotated secret fails here in seconds, not at export: the name
          # release-macos.sh asks for, and a certificate the keychain above holds.
          [ "$NAME" = "M1K3" ] || { echo "❌ profile is named '$NAME'; release-macos.sh asks for 'M1K3'"; exit 1; }
          PROFILE_CERT="$(security cms -D -i "$PROFILE" | plutil -extract DeveloperCertificates.0 raw - \
            | base64 --decode | shasum -a 1 | cut -c1-40 | tr 'a-f' 'A-F')"
          security find-identity -p codesigning -v "$KEYCHAIN" | grep -q "$PROFILE_CERT" || {
            echo "❌ the profile's certificate ($PROFILE_CERT) is not the imported Developer ID identity"; exit 1; }
          # …and grants everything the app's entitlements ask for (a regenerated profile that
          # dropped Declared Age Range or the keychain group would otherwise die at launch).
          python3 macos/tools/ci/check_profile_grants.py --profile "$PROFILE" \
            --entitlements macos/M1K3App/M1K3.entitlements --team "$APPLE_TEAM_ID"
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          rm -f "$PROFILE"
          echo "Installed: $NAME ($UUID)"

      - name: Store notary credentials (matches release-macos.sh profile)
        if: steps.gate.outputs.configured == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PW: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PW" \
            --keychain "$KEYCHAIN"

      - name: Build the notarized DMG
        if: steps.gate.outputs.configured == 'true'
        env:
          # The ephemeral keychain holds ONLY Developer ID Application —
          # Automatic signing can't archive without an Apple Development cert
          # (proven by run 29027965918), so the script signs manually here.
          M1K3_SIGN_STYLE: manual
        run: macos/tools/release/release-macos.sh

      - name: Publish a DateVer release (stable latest-download URL)
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="$(find /tmp/m1k3-release -maxdepth 1 -name 'M1K3-*.dmg' | sort | tail -1)"
          [ -f "$DMG" ] || { echo "❌ No DMG produced"; exit 1; }
          VERSION="$(grep -m1 'MARKETING_VERSION:' macos/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          SHORT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y.%m.%d)"           # DateVer (CalVer) — one dated release per day
          # Stable asset name → a PERMANENT download URL the site can hardlink:
          #   https://github.com/<owner>/<repo>/releases/latest/download/M1K3.dmg
          cp "$DMG" "$RUNNER_TEMP/M1K3.dmg"
          # Same-day re-run replaces today's release; earlier days accumulate as history.
          # --latest marks this the newest release so /releases/latest resolves to it.
          gh release delete "$DATE" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$DATE" "$RUNNER_TEMP/M1K3.dmg" \
            --target "$GITHUB_SHA" \
            --title "M1K3 $DATE (app v$VERSION · $SHORT)" \
            --latest \
            --notes "Nightly build of M1K3 for Mac — signed, notarized, stapled (Developer ID, off-store). App version $VERSION, built from master @ $SHORT. Not the App Store build.

          Permanent download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/M1K3.dmg"
          echo "✅ Published DateVer release $DATE → M1K3.dmg ($(du -h "$DMG" | cut -f1))"

      - name: Bump the Homebrew cask (Round-Tower/homebrew-tap)
        # `brew install --cask round-tower/tap/m1k3` pins the release date as the
        # cask version and the DMG's sha256. Without this step the cask serves
        # the last bumped nightly (still signed, still working — just older).
        # Gated on TAP_PUSH_TOKEN: a fine-grained PAT with contents:write on
        # Round-Tower/homebrew-tap only (github.token can't push to another repo).
        if: steps.gate.outputs.configured == 'true'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${TAP_PUSH_TOKEN:-}" ]; then
            echo "::notice::TAP_PUSH_TOKEN not set — the Homebrew cask keeps its current version. Add the secret to bump it nightly."
            exit 0
          fi
          # The DMG is already published above — that is the nightly's deliverable.
          # A tap hiccup (revoked token, non-fast-forward, network) must not redden
          # this run: the bump runs in a subshell and any failure becomes an
          # ::error:: annotation, still exit 0.
          (
            set -euo pipefail
            DATE="$(date -u +%Y.%m.%d)"
            SHORT="$(git rev-parse --short HEAD)"
            SHA="$(shasum -a 256 "$RUNNER_TEMP/M1K3.dmg" | cut -d' ' -f1)"
            git clone --depth 1 "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/Round-Tower/homebrew-tap.git" "$RUNNER_TEMP/tap"
            CASK="$RUNNER_TEMP/tap/Casks/m1k3.rb"
            sed -i '' -E "s/^  version \".*\"/  version \"$DATE\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" "$CASK"
            # A pattern that no longer matches the cask's layout leaves the file
            # untouched and sed exits 0 — check the result, never the exit code.
            grep -q "^  version \"$DATE\"" "$CASK" && grep -q "^  sha256 \"$SHA\"" "$CASK" \
              || { echo "cask layout drifted: version/sha256 lines not rewritten in $CASK"; exit 1; }
            cd "$RUNNER_TEMP/tap"
            if git diff --quiet; then echo "cask already at $DATE / $SHA"; exit 0; fi
            git -c user.name="m1k3-nightly" -c user.email="nightly@m1k3.app" commit -qam "m1k3 $DATE (master @ $SHORT)"
            git push -q origin HEAD
            echo "✅ Cask bumped to $DATE"
          ) || echo "::error::Homebrew cask bump failed — the DMG is published; bump Casks/m1k3.rb by hand (see #271)"

      - name: Clean up the temporary keychain
        if: always() && steps.gate.outputs.configured == 'true'
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

