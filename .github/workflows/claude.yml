name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post comments and suggestions
      issues: write # Required to respond to issues
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for context

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Allow Claude to interact with GitHub. A summon review ends with the
          # VERDICT line the landing gate reads (pr_watch.py; 2026-10-10). It rides
          # --append-system-prompt because a `prompt` input would switch the action
          # out of tag mode (it would stop answering @claude). claude_args is parsed
          # by shell-quote: no $, backslash, backtick or inner double quote in it.
          # Signed: Kev + claude-opus-5.5, 2026-10-10, Confidence 0.75, Prior: Unknown (this block only)
          claude_args: >-
            --allowed-tools "Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*)"
            --append-system-prompt "When your task on a pull request is or includes a review,
            end your final comment with exactly one verdict line, as its last line:
            VERDICT: APPROVE @ <head-sha> when nothing you found blocks landing (nits and style never block),
            else VERDICT: CHANGES_REQUESTED @ <head-sha>.
            Here <head-sha> is the PR head commit you reviewed: read it when you start, with
            gh pr view <number> --json headRefOid.
            The landing gate (macos/tools/ci/pr_watch.py) reads only that line;
            a missing or malformed one refuses the merge."
