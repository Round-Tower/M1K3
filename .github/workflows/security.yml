name: Security

# Slim, high-signal security scanning. Replaced the old security-scanning.yml,
# which ran CodeQL (errored: needs repo "Code Security" enabled) and npm-audit
# (no real Node app — root had only a stub package.json). What's left is the
# cheap, genuinely-useful stuff for a privacy-focused local-AI project:
#   • secrets detection (verified only — no noise)
# CodeQL now runs as GitHub's default code-scanning setup (not from this file)
# and is a required check on master's ruleset, beside TruffleHog below.
# The Python SAST (Bandit) left with the archived Python surface (attic/,
# cleared from the tree 2026-08-13 — history before 7545b4a4 keeps it).

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets · TruffleHog
    runs-on: ubuntu-24.04 # not -latest: that label becomes Ubuntu 26 on 2026-10-19 (#582); move deliberately
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified
