name: CI

# Lean test pipeline — tests what M1K3 actually ships.
#   • swift-mac : the Mac-native MVP (the active surface), via `swift test`
#
# The archived Python surface (attic/) was cleared from the working tree on
# 2026-08-13 along with its path-filtered attic.yml workflow — git history
# before 7545b4a4 keeps all of it (`git checkout 7545b4a4 -- attic`). The old
# Node/Playwright "unified suite" went the same way earlier: it tested a web
# dashboard, was perpetually red, and never covered the Swift work.

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap path gate: the three macOS jobs below are the expensive tier (full
  # MLX/Metal + RealityKit graph on macos-26 runners, 15-30 min each) and can
  # only break on compilable-surface changes. Docs, site/, marketing,
  # and release-script edits skip them entirely — the seconds-cheap ubuntu
  # guards (scheme-drift, doc-drift) still run on everything, so docs↔code
  # sync stays enforced. Public-repo runners are free; the spend here is
  # wall-clock and the shared macOS concurrency queue.
  #
  # Two finer gates (2026-09-24): on a PULL REQUEST the App-shell job runs only
  # when the `shell` filter matches and the iOS+visionOS job only when `mobile`
  # does (the lists differ: mobile also compiles shell sources; shell does not
  # compile mobile ones). A package-only PR is gated by `swift test` (~4 min)
  # instead of ~20. Every PUSH (master, develop) still builds all three, so a
  # package rename that breaks a shell is caught on the push run within the
  # hour and fixed forward — with Xcode Cloud and the nightly DMG behind it.
  # pr_watch reads a skipped job as green.
  changes:
    name: Detect compilable changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      shell: ${{ steps.filter.outputs.shell }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - '.github/workflows/ci.yml'
              - 'macos/**'
              - '!macos/docs/**'
              - '!macos/tools/release/**'
              - '!macos/fastlane/**'
              - '!macos/tools/ci/**'   # Python, tested by the guards job — no Swift compiles it
              - '!macos/**/*.md'
            # What the App-shell job compiles and nothing else does: the shell,
            # the two Xcode-native targets it embeds (M1K3CLI helper, the
            # .saver), the shared icon document, the project spec, the manifest.
            shell:
              - '.github/workflows/ci.yml'
              - 'macos/M1K3App/**'
              - 'macos/M1K3CLI/**'
              - 'macos/M1K3Screensaver/**'
              - 'macos/M1K3.icon/**'
              - 'macos/project.yml'
              - 'macos/Package.swift'
              - 'macos/Package.resolved'
            # What the mobile job compiles — MobileShell also builds a dozen
            # files out of M1K3App/ and the same icon document. UITests/ is not
            # here: those are test targets, and this job only builds.
            mobile:
              - '.github/workflows/ci.yml'
              - 'macos/M1K3iOSApp/**'
              - 'macos/M1K3visionOS/**'
              - 'macos/M1K3App/**'
              - 'macos/M1K3.icon/**'
              - 'macos/project.yml'
              - 'macos/Package.swift'
              - 'macos/Package.resolved'

  swift-mac:
    name: Swift · Mac MVP (swift test)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # macos/ targets .macOS(.v26): the test binary links FoundationModels.framework,
    # a macOS 26 runtime framework — so the tests must RUN on a Tahoe+ runner.
    # Pin macos-26. Xcode 27 is not on the runner image yet (GA 2026-09-15);
    # macOS-27-only code compiles behind `#if compiler(>=6.4)` and is excluded
    # here. Bump to xcode-version "27" when the image carries it.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (26.x — the runner image does not carry Xcode 27 yet)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # Restore/save are split on purpose. actions/cache SKIPS the save on an
      # exact key hit, so one snapshot (saved 2026-09-05, 1.1 GB) served every run
      # for a week while the job still recompiled all ~1,000 MLX files (222 s).
      # Now: every run restores the NEWEST snapshot by prefix; only pushes to
      # master save a fresh one (run_id in the key makes each save unique). PR
      # runs never upload — a ~1 GB upload per run would churn the 10 GB cap.
      #
      # github.repository is IN the key deliberately: the runner's workspace path
      # is /Users/runner/work/<repo>/<repo>, and Clang's module cache bakes
      # absolute paths into its .pcm files. The 2026-08-31 repo rename
      # (m1k3 -> M1K3) left a stale cache with the OLD path baked in, which
      # collided with the NEW path mid-build ("module '_DarwinFoundation1' is
      # defined in both ...", clang segfault). Keying on the repo name means any
      # future rename busts the cache instead of poisoning it.
      - name: Restore SwiftPM build
        uses: actions/cache/restore@v4
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('macos/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('macos/Package.resolved') }}-
            spm-${{ runner.os }}-${{ github.repository }}-

      - name: swift test
        working-directory: macos
        # MLX/Metal + WhisperKit integration tests are env-gated OFF: they only
        # run from a bundled .app (see project-memory "metallib wall"), never CLI.
        env:
          M1K3_MLX_INTEGRATION: "0"
        # --xunit-output keeps per-test wall times on every run (issue #296: the
        # parallel suite stalls the runner and short watchdogs fire; the stall is
        # visible as a block of trivial tests all reporting the same N s).
        run: swift test --parallel --xunit-output test-results/xunit.xml

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-timings
          path: macos/test-results/
          retention-days: 14

      - name: Save SwiftPM build (master only)
        # !cancelled(): a failing TEST still leaves a good .build — the first
        # master run after the split (73929882) failed one test and saved nothing.
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('macos/Package.resolved') }}-${{ github.run_id }}

  app-build:
    name: Swift · App shell (xcodebuild)
    needs: changes
    # PR: only when the diff touches what this job alone compiles (the `shell`
    # filter). Push (master, develop): always — the fix-forward backstop.
    if: needs.changes.outputs.swift == 'true' && (github.event_name == 'push' || needs.changes.outputs.shell == 'true')
    # `swift test` compiles only the SwiftPM PACKAGE. The app shell (M1K3App/:
    # AppEnvironment + its extensions, SelfTest, MCPHostController, IssueReporter,
    # every SwiftUI view) is an Xcode target that otherwise compiles ONLY in
    # Xcode Cloud, post-merge — so a break there passes every PR check and first
    # fails at release time, disconnected from its cause. This builds it unsigned
    # (no secrets, no archive) purely to prove it COMPILES + links on each PR.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (26.x — the runner image does not carry Xcode 27 yet)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # Speeds package resolution (mlx-swift-lm is a heavy clone) by caching
      # xcodebuild's resolved SourcePackages between runs.
      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: macos/.spm-cache
          # github.repository in the key: see the swift-mac job's cache step for why.
          key: xcodebuild-spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: xcodebuild-spm-${{ runner.os }}-${{ github.repository }}-

      # M1K3.xcodeproj is gitignored (project.yml is the source of truth). xcodegen
      # regenerates it. xcbeautify formats the build log. Homebrew works on the
      # macos-26 GH runner (unlike the Xcode Cloud beta image, which fetches a
      # pinned xcodegen binary in ci_scripts/ci_post_clone.sh).
      - name: Install xcodegen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: macos
        # Unsigned: CODE_SIGNING_ALLOWED=NO drops the signing phase (no certs on a
        # PR runner). The default GH Actions shell sets `pipefail`, so a build
        # failure still fails the job even through the xcbeautify pipe.
        run: |
          xcodebuild \
            -project M1K3.xcodeproj \
            -scheme M1K3 \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify

  mobile-build:
    name: Swift · iOS + visionOS shells (xcodebuild)
    needs: changes
    # PR: only when the diff touches what this job alone compiles (the `mobile`
    # filter). Push (master, develop): always — the fix-forward backstop.
    if: needs.changes.outputs.swift == 'true' && (github.event_name == 'push' || needs.changes.outputs.mobile == 'true')
    # The iOS/visionOS shell (M1K3iOSApp/ on the portable package graph) was
    # local-verify-only since PR #9 — a PR could break the mobile compile and
    # first fail at release. Builds both schemes unsigned against the SIMULATOR
    # SDKs (generic destination, no boot) purely to prove compile + link. One
    # job, two steps: the checkout/xcodegen/SPM-resolve cost is paid once and
    # the visionOS build reuses the shared clone cache. The macos-26 runner
    # image ships the visionOS SDK + simulators (verified 2026-07-08).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (26.x — the runner image does not carry Xcode 27 yet)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: macos/.spm-cache
          # github.repository in the key: see the swift-mac job's cache step for why.
          key: xcodebuild-spm-mobile-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: xcodebuild-spm-mobile-${{ runner.os }}-${{ github.repository }}-

      - name: Install xcodegen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Build iOS app (unsigned, simulator SDK)
        working-directory: macos
        run: |
          xcodebuild \
            -project M1K3.xcodeproj \
            -scheme M1K3iOS \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify

      - name: Build visionOS app (unsigned, simulator SDK)
        working-directory: macos
        run: |
          xcodebuild \
            -project M1K3.xcodeproj \
            -scheme M1K3visionOS \
            -destination 'generic/platform=visionOS Simulator' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify

  scheme-drift:
    # The native Xcode Cloud Test action runs the test targets hand-listed in the
    # M1K3-Tests workspace scheme (the app project can't reference package test
    # targets). Guard against a `.testTarget` added to Package.swift but not the
    # scheme — which would silently never run. Pure-Python, no build, seconds.
    name: Project guards (test scheme · store targets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check M1K3-Tests scheme vs Package.swift
        working-directory: macos
        run: python3 tools/ci/check_test_scheme.py
      # Every store-bound app target must upload into the ONE universal App Store
      # record (`app.m1k3`), ship a privacy manifest (iOS/visionOS), and own its
      # generated Info.plist. A drift here fails only at Xcode Cloud upload
      # otherwise — after the full build, with no file:line. Seconds, pure Python.
      - name: Check store targets share the one App Store record
        working-directory: macos
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet 'pyyaml>=6,<7'
          python3 tools/ci/check_store_targets.py
      # An embedded command-line tool must land under Contents/Helpers: at
      # Contents/MacOS Xcode's sign-on-copy re-signs it as the app itself, the
      # developer-id export aborts, and the helper ships with the app's
      # entitlements (found 2026-09-11 with `m1k3`). Seconds, pure Python.
      - name: Check embedded tools land under Contents/Helpers
        working-directory: macos
        run: python3 tools/ci/check_helper_embed.py
      # Swift Testing starts every test at once; on this 3-core runner a test's
      # wall time is mostly the pool's backlog (7-8 s for 90% of tests on
      # 2026-09-12). A bound under 30 s measures that, not the code — #296.
      - name: No test bets on a short wall-clock bound
        working-directory: macos
        run: python3 tools/ci/check_wall_clock_bounds.py
      # The App Store copy in every language lives in fastlane/metadata_mac so it
      # can be riffed on; Apple rejects the whole upload when one field runs over
      # its CHARACTER limit, and a locale without a support URL blocks App Review.
      - name: Store copy fits Apple's limits in every locale
        working-directory: macos
        run: python3 tools/ci/check_store_metadata.py
      # The guards' pure helpers have unit tests (test_check_*.py) that nothing
      # ran until 2026-09-02 — a helper regression would have passed CI while the
      # guard quietly stopped guarding. Run them.
      - name: Unit-test the guards themselves (+ the eval and weights tooling)
        working-directory: macos
        run: |
          python3 -m pip install --quiet 'pytest>=8,<9' 'pyyaml>=6,<7'
          python3 -m pytest -q tools/ci tools/eval tools/weights tools/site tools/asc
      # llms-full.txt is generated from the site pages; a page edit without a
      # regenerate would leave the AI-readable copy stale.
      - name: llms-full.txt is current
        working-directory: macos
        run: python3 tools/site/llms_full.py --check

  doc-drift:
    # Guard the docs against silent staleness: every `.library` product in
    # Package.swift must appear in macos/docs/MODULE_MAP.md (and no ghost
    # rows). Born from four modules going undocumented — the first thing a
    # contributor reads must not lie. Pure-Python, no build, seconds.
    name: Docs match the code (module map)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check docs/MODULE_MAP.md vs Package.swift
        working-directory: macos
        run: python3 tools/ci/check_doc_drift.py

  # Posts a per-job build-status list to Slack (same shape as the dyslexia-ai-server
  # `verify` workflow: act10ns/slack, if-always, ✅/❌ per job). No-op until the
  # SLACK_WEBHOOK_URL secret is set, so it never reddens CI before Slack is wired.
  # Wire it: repo Settings → Secrets and variables → Actions → new secret
  # SLACK_WEBHOOK_URL = a Slack incoming-webhook URL (posts to its bound channel).
  notify:
    name: Notify Slack
    # 'skipped' is healthy here: the changes gate deliberately skips the macOS
    # jobs on non-compilable diffs (⏭️, and the run still counts as success).
    # The gate job itself must succeed — a broken gate silently skipping every
    # build would otherwise read as green.
    needs:
      [changes, swift-mac, app-build, mobile-build, scheme-drift, doc-drift]
    runs-on: ubuntu-latest
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Slack build status
        if: env.SLACK_WEBHOOK_URL != ''
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ (needs.changes.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.swift-mac.result) && contains(fromJSON('["success","skipped"]'), needs.app-build.result) && contains(fromJSON('["success","skipped"]'), needs.mobile-build.result) && needs.scheme-drift.result == 'success' && needs.doc-drift.result == 'success') && 'success' || 'failure' }}
          message: |
            M1K3 CI · ${{ github.ref_name }} (${{ github.event_name }})

            ${{ needs.swift-mac.result == 'success' && '✅' || (needs.swift-mac.result == 'skipped' && '⏭️' || '❌') }} : Swift · Mac MVP (swift test)
            ${{ needs.app-build.result == 'success' && '✅' || (needs.app-build.result == 'skipped' && '⏭️' || '❌') }} : Swift · App shell (xcodebuild)
            ${{ needs.mobile-build.result == 'success' && '✅' || (needs.mobile-build.result == 'skipped' && '⏭️' || '❌') }} : Swift · iOS + visionOS shells (xcodebuild)
            ${{ needs.scheme-drift.result == 'success' && '✅' || '❌' }} : Project guards (test scheme · store targets)
            ${{ needs.doc-drift.result == 'success' && '✅' || '❌' }} : Docs match the code (module map)

            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · by ${{ github.actor }}

# Signed: Kev + claude-opus-4-8, 2026-06-06, Confidence 0.75, Prior: Unknown
# CI overhaul: ripped out the red Node/Playwright "unified suite" (tested a web
# dashboard, never covered the Swift MVP). Replaced with swift test + a curated,
# empirically-verified green Python smoke subset (44 files / 102 tests / ~24s).
# Confidence 0.75 not higher: the swift-mac job is verify-by-CI — it depends on
# the hosted runner image shipping Xcode 26 (macOS 26 SDK), which I could not
# confirm from here. The python-smoke set IS verified green locally.
# Review: Kev + claude-fable-5.1, 2026-09-12 — swift-mac cache split into
# restore (every run, newest by prefix) + save (master pushes only, run_id key):
# the exact-hit snapshot from 09-05 never re-saved, so every run recompiled MLX
# (222 s). The job also writes --xunit-output timings, uploaded as an artifact
# for the #296 stall hunt. Confidence now 0.8: the mechanism is actions/cache's
# documented behaviour; the saving is verify-by-run (compare a PR run AFTER the
# first master save: "Compiling MLX" count and build time vs 1013 / 222 s).
# Review: Kev + claude-fable-5.1, 2026-09-24 — the two xcodebuild jobs are
# path-gated on pull requests (`shell` / `mobile` filters) and unconditional on
# branch pushes (master, develop). Why: 100 PRs in 30 days, a third under 100 lines, each paying
# ~20 min of shell builds for a package-only diff; `swift test` is the PR gate
# now. The cost is a shell break landing on master first — caught on the push
# run, Xcode Cloud and the nightly. Confidence now 0.8: the `if` shape and the
# skipped-reads-green path are verify-by-run on this PR's own checks.
