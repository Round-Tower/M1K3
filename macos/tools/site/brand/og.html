<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>og</title>
<!-- The share card, site/og.png (1200×630): the m1k3.app hero, frozen. Rendered
     by macos/tools/site/render_brand_images.py, which serves only site/ and these templates over loopback, so
     /site/... resolves to the site's own faces, THREE.js and Fox.glb. The scene
     is index.html's (grid, lights, the phosphor treatment, the camera) with the
     fox stood further right so the longer third line clears it. Not served. -->
<link rel="stylesheet" href="/site/fonts.css" />
<style>
  :root {
    --bg: #050505; --ink: #e8e8e8; --ink-bright: #ffffff; --ink-dim: #8a8a8a; --ink-faint: #4a4a4a;
    --line: rgba(232,232,232,0.10);
    --pixel: 'VT323', monospace; --mono: 'IBM Plex Mono', monospace; --sans: 'Inter', -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  .copy { position: absolute; left: 40px; top: 42px; z-index: 2; }
  h1 {
    font-family: var(--pixel); font-weight: 400; font-size: 108px; line-height: 0.92;
    color: var(--ink-bright); text-shadow: 0 0 24px rgba(255,255,255,0.08); margin-bottom: 26px;
  }
  h1 .dim { color: var(--ink-faint); }
  .sub { font-size: 19px; line-height: 1.6; font-weight: 300; color: var(--ink-dim); max-width: 560px; margin-bottom: 38px; }
  .sub strong { color: var(--ink); font-weight: 500; }
  .cta-row { display: flex; gap: 16px; }
  .btn {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 19px 30px; border: 1px solid var(--ink); color: var(--ink);
  }
  .btn-primary { background: linear-gradient(90deg, #f2f2f2, #c8c8c8); color: #000; font-weight: 500; }
  .btn-ghost { border-color: rgba(232,232,232,0.16); }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(0,0,0,0.6) 100%);
  }
</style>
<script>
  // A render that fails says why in the title, which is what the renderer reads.
  addEventListener('error', e => { document.title = 'error: ' + e.message; });
  addEventListener('unhandledrejection', e => { document.title = 'error: ' + e.reason; });
</script>
<script type="importmap">
{ "imports": {
    "three": "/site/vendor/three/three.module.js",
    "three/addons/": "/site/vendor/three/jsm/"
} }
</script>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div class="copy">
    <h1>Your AI.<br />Your Mac.<br /><span class="dim" id="line3">Private by design.</span></h1>
    <p class="sub" id="sub">M1K3 is local AI that runs <strong>entirely on your Mac</strong>. Local models, live voice, a knowledge graph that remembers everything — no account, no telemetry.</p>
    <div class="cta-row">
      <span class="btn btn-primary">Download for Mac</span>
      <span class="btn btn-ghost">Install in two minutes</span>
    </div>
  </div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const W = 1200, H = 630;
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.055);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
camera.position.set(0, 1.6, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
stage.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xe8e8e8, 2.2); rim.position.set(-6, 3, -4); scene.add(rim);

const grid = new THREE.GridHelper(80, 80, 0x3a3a3a, 0x161616);
scene.add(grid);

// index.html stands the fox at x 2.9 with the camera looking at x 1.7; here it
// stands at 5.2 so "Private by design." (three glyphs longer than the old line) clears it.
const rig = new THREE.Group();
rig.position.set(5.2, 0, 0);
scene.add(rig);

function phosphorise(root) {
  const shells = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    o.material = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.55, metalness: 0.25, emissive: 0x0a0a0a });
    const mat = new THREE.MeshBasicMaterial({
      color: 0xe8e8e8, wireframe: true, transparent: true, opacity: 0.16,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    if (o.isSkinnedMesh) {
      const s = new THREE.SkinnedMesh(o.geometry, mat);
      s.bind(o.skeleton, o.bindMatrix);
      shells.push([o, s]);
    } else {
      shells.push([o, new THREE.Mesh(o.geometry, mat)]);
    }
  });
  shells.forEach(([host, shell]) => host.parent.add(shell));
}

function frame() {
  camera.lookAt(2.9 - 1.2, 1.2, 0);
  renderer.render(scene, camera);
}

// Load each face explicitly: fonts.ready alone can resolve before layout has asked for any.
const faces = ['108px VT323', '300 19px Inter', '500 19px Inter', '13px "IBM Plex Mono"', '500 13px "IBM Plex Mono"'];
const done = () => Promise.all(faces.map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => { frame(); document.title = 'ready'; }, e => { document.title = 'error: ' + e; });

new GLTFLoader().load('/site/vendor/Fox.glb', gltf => {
  gltf.scene.scale.setScalar(0.026);
  gltf.scene.rotation.y = -1.0;   // index.html: -0.6; turned further so the off-centre fox still reads side-on
  phosphorise(gltf.scene);
  rig.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const survey = gltf.animations.find(c => c.name === 'Survey');
  if (survey) { mixer.clipAction(survey).play(); mixer.setTime(0.8); }   // a fixed pose, so every render is the same
  done();
}, undefined, () => { document.title = 'error: Fox.glb did not load'; });
</script>
</body>
</html>
