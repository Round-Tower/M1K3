# M1K3 — macOS app shell (XcodeGen)
#
# Source of truth for M1K3.xcodeproj. Regenerate with `xcodegen generate`; the
# pbxproj is a build artifact, not hand-maintained — this sidesteps the stale-
# settings / ID-churn trap of copying a hand-authored project from another repo.
#
# The app target is a thin SwiftUI shell over the local SwiftPM package at `.`
# (same package `swift test` drives). macOS 26 Tahoe only: real Liquid Glass +
# on-device Foundation Models. App-sandboxed + hardened from day one so the
# runtime constraints the unit tests can't see (sandbox file paths, entitlements)
# surface now, not at ship.
#
# Signed: Kev + claude-opus-4-8, 2026-06-06, Confidence 0.8, Prior: Unknown

name: M1K3

options:
  bundleIdPrefix: app.m1k3
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.2"
    # Versioning scheme: see /VERSIONING.md. This is the single source of truth
    # for the user-facing version on every Apple surface (TestFlight, MAS, the
    # nightly DMG's name). Build numbers are Xcode Cloud's (auto-managed).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # A STABLE signing identity is load-bearing, not cosmetic: macOS keys both the
    # Keychain ACL and TCC (microphone / Speech) grants to the app's code-signing
    # identity. An empty team here makes every `xcodegen generate` fall back to bare
    # ad-hoc linker-signing, whose cdhash changes each build — so the app looks
    # brand-new every launch: the Keychain re-prompts for the password and Speech
    # authorization silently fails (transcripts capture nothing). Pinning the Round
    # Tower team gives one consistent identity → grants persist, entitlements +
    # sandbox actually apply.
    # Signed: Kev + claude-opus-4-8, 2026-06-12, Confidence 0.9, Prior: Unknown
    DEVELOPMENT_TEAM: "76DJH43A4P"
    CODE_SIGN_STYLE: Automatic

packages:
  M1K3:
    path: .

# The shared mobile shell (iOS + visionOS): one source list, one dependency set,
# so the two platform targets can't silently drift apart. This was a pair of YAML
# anchors hanging off M1K3iOS until 2026-07-20 — promoted to a real XcodeGen
# template when the targets first needed to DIVERGE (app-icon assets: Icon
# Composer can't author visionOS icons, so each carries its own). A target's own
# `sources:` are appended to the template's, which is what makes that possible.
targetTemplates:
  MobileShell:
    sources:
      - path: M1K3iOSApp
      # Shared, cross-platform look-and-feel lifted from the macOS app target:
      # the procedural pixel-face avatar (now #if-guarded for UIColor), its
      # emotion→colour map (pure SwiftUI), the reading modes (ReadingMode enum +
      # ReadingText renderer — zero AppKit), the Silkscreen pixel brand font,
      # and the OpenDyslexic faces the dyslexia reading mode needs
      # (BundledFonts.register() already lists them; it silently skips missing
      # resources, so the .otf lines below are load-bearing).
      - path: M1K3App/AvatarView.swift
      - path: M1K3App/AvatarEmotion+SwiftUI.swift
      - path: M1K3App/PixelFont.swift
      - path: M1K3App/ReadingMode.swift
      - path: M1K3App/ReadingText.swift
      # Voice mode's follow-the-spoken-word line (2026-09-03): the Mac's
      # observable highlight state + the paint layer, both package-only deps.
      - path: M1K3App/SpeechHighlight.swift
      - path: M1K3App/KaraokeReadingText.swift
      # The opt-in 3D companion creatures (Fox/Inkfish/Sparrow/Gecko/Colobus): the
      # RealityKit render path, #if-guarded for iOS/visionOS. The assets ship in
      # M1K3Avatar's bundle already. NOTE: the shading glue (PhosphorMaterial.swift
      # + Phosphor.metal) is NOT here — CustomMaterial surface shaders are macOS/iOS
      # only (visionOS uses ShaderGraphMaterial, and the xrOS SDK ships no
      # RealityKit.h Metal header), so those two files live on the iOS target alone
      # and CompanionAvatarView #if's out its shading calls on visionOS.
      - path: M1K3App/CompanionAvatarView.swift
      - path: M1K3App/CodeBlockView.swift
      # App Store privacy manifest — Apple REQUIRES one at the bundle root of every
      # iOS/visionOS submission (the Mac target sweeps it in with `M1K3App/`; this
      # template cherry-picks, so it's explicit here). The SAME file: zero tracking,
      # zero collected data, the same four required-reason APIs — one promise,
      # three platforms. Guarded by tools/ci/check_store_targets.py.
      - path: M1K3App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: M1K3App/Resources/Fonts/Silkscreen-Regular.ttf
        buildPhase: resources
      - path: M1K3App/Resources/Fonts/Silkscreen-Bold.ttf
        buildPhase: resources
      - path: M1K3App/Resources/Fonts/OpenDyslexic-Regular.otf
        buildPhase: resources
      - path: M1K3App/Resources/Fonts/OpenDyslexic-Bold.otf
        buildPhase: resources
    dependencies:
      # The portable package pipeline (protocol-seam first, so it cross-compiles):
      # RAG chat + knowledge + memory + inference + MLX + the agent tool loop +
      # the avatar. NO WhisperKit/Calls/MCP — the in-app server is Phase-B.
      # M1K3Preview links transitively via M1K3AgentTools.
      - package: M1K3
        product: M1K3Chat
      - package: M1K3
        product: M1K3Knowledge
      - package: M1K3
        product: M1K3Memory
      - package: M1K3
        product: M1K3MemoryChatBridge
      - package: M1K3
        product: M1K3Inference
      - package: M1K3
        product: M1K3Agent
      - package: M1K3
        product: M1K3AgentTools
      - package: M1K3
        product: M1K3KnowledgeTools
      - package: M1K3
        product: M1K3MLX
      - package: M1K3
        product: M1K3Avatar
      # Voice-first mode (2026-07-29): the portable voice loop + system-framework
      # providers (SFSpeechRecognizer STT, AVSpeechSynthesizer TTS), and since
      # 2026-09-03 M1K3 Voice — Kokoro on pure MLX (Settings ▸ Voice, downloads
      # on pick; Built-in stays the default). WhisperKit stays Mac-only for now.
      - package: M1K3
        product: M1K3Voice
      - package: M1K3
        product: M1K3Kokoro
      # MetricKit digest/retention pure logic (#86) — AppCore+MetricKit.swift's
      # collector calls MetricPayloadDigest/MetricRetentionPolicy directly.
      - package: M1K3
        product: M1K3Diagnostics
      # Brain at Home, device side (Phase C): QR pairing ceremony, TLS-PSK
      # transport, HomeBrainProvider — the Mac's brain in the phone's slot.
      # MCP-free by design (this shell links no MCP stack).
      - package: M1K3
        product: M1K3BrainLink

targets:
  M1K3:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: M1K3App
      # Icon Composer (.icon) app icon — referenced as a single file so XcodeGen
      # doesn't recurse into the bundle; actool compiles it via APPICON_NAME below.
      - path: M1K3.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: M1K3
        product: M1K3Chat
      - package: M1K3
        product: M1K3Knowledge
      - package: M1K3
        product: M1K3Inference
      - package: M1K3
        product: M1K3Voice
      - package: M1K3
        product: M1K3Agent
      - package: M1K3
        product: M1K3LanguageModel
      - package: M1K3
        product: M1K3KnowledgeTools
      - package: M1K3
        product: M1K3AgentTools
      - package: M1K3
        product: M1K3MLX
      - package: M1K3
        product: M1K3WhisperKit
      - package: M1K3
        product: M1K3Calls
      - package: M1K3
        product: M1K3Avatar
      - package: M1K3
        product: M1K3Kokoro
      - package: M1K3
        product: M1K3MCPKit
      - package: M1K3
        product: M1K3MCPLog
      - package: M1K3
        product: M1K3Eval
      - package: M1K3
        product: M1K3Launch
      - package: M1K3
        product: M1K3Memory
      - package: M1K3
        product: M1K3MemoryChatBridge
      - package: M1K3
        product: M1K3MemoryViz
      - package: M1K3
        product: M1K3Preview
      - package: M1K3
        product: M1K3Diagnostics
      - package: M1K3
        product: M1K3Heartbeat
      - package: M1K3
        product: M1K3BrainServe
      # Shared Brain at Home wire (pairing payload compose + LAN addresses
      # for the QR) — the client half rides the mobile shells.
      - package: M1K3
        product: M1K3BrainLink
      # The screensaver's pure core — the app uses ScreenSaverInstall for the
      # "Set Up Screen Saver" Settings row (status + install action).
      - package: M1K3
        product: M1K3ScreensaverCore
      # Embed the .saver so Settings can install it: M1K3 is sandboxed and can't
      # write to ~/Library/Screen Savers directly, so the app ships the bundle
      # and hands it to macOS via NSWorkspace.open (the native install prompt).
      # Copied into Contents/Resources; link:false — a .saver isn't linkable.
      # (MAS note: embedded plug-ins are restricted on the App Store; M1K3's
      # primary channel is the Developer-ID DMG, where this is fine.)
      - target: M1K3Screensaver
        link: false
        copyFiles:
          destination: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.m1k3
        PRODUCT_NAME: M1K3
        ASSETCATALOG_COMPILER_APPICON_NAME: M1K3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Kevin Murphy"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        # DEFAULT to the App-Store-SAFE entitlements (no audioanalyticsd
        # mach-lookup exception, which ITMS-90285 rejects). The privileged direct-
        # distribution set (M1K3.entitlements, with the exception) is an explicit
        # OPT-IN in release-macos.sh's archive override — so any path that DOESN'T
        # opt in (Xcode Organizer "Distribute App", the Xcode Cloud Release archive,
        # release-mas.sh) is App-Store-safe by default. Least privilege as the
        # default; the dangerous entitlement can only ship if a script asks for it.
        # (Build 53 was rejected because the old default leaked the exception into a
        # TestFlight archive that never passed through release-mas.sh's override.)
        # Signed: Kev + claude-opus-4-8, 2026-06-19, Confidence 0.85, Prior: Unknown
        CODE_SIGN_ENTITLEMENTS: M1K3App/M1K3-MAS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: M1K3App/Info.generated.plist
      properties:
        CFBundleDisplayName: M1K3
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableDescription: "Local, private AI companion."
        NSMicrophoneUsageDescription: "M1K3 uses the microphone for voice input. Audio is transcribed on-device and never leaves your Mac."
        NSSpeechRecognitionUsageDescription: "M1K3 transcribes your speech on-device to let you ask questions by voice. Nothing is sent to Apple or any server."
        # Brain at Home (default OFF): advertising the paired-devices brain
        # service on the local network (Bonjour) — macOS surfaces a local-network
        # consent dialog on first use.
        NSLocalNetworkUsageDescription: "Brain at Home serves M1K3's brain to devices you pair by QR code — on your local network only, encrypted, off by default."
        NSBonjourServices:
          - "_m1k3._tcp"
        # The context senses (default OFF, docs/CONTEXT_TOOLS_PLAN.md): TCC
        # prompts fire only on first use, after the in-app toggle is on.
        NSCalendarsFullAccessUsageDescription: "M1K3 reads your next few events (titles and times) to ground answers — only while the Calendar context toggle is on. Nothing leaves your Mac."
        # Both location keys: requestWhenInUseAuthorization documents the
        # WhenInUse key on macOS; the general key is belt-and-braces (audit S3).
        NSLocationUsageDescription: "M1K3 uses your location — a coarse ~10 km area unless you opt up to precise — to ground answers, only while the Location context toggle is on. Nothing leaves your Mac."
        NSLocationWhenInUseUsageDescription: "M1K3 uses your location — a coarse ~10 km area unless you opt up to precise — to ground answers, only while the Location context toggle is on. Nothing leaves your Mac."
        # Export compliance: M1K3 uses only standard, exempt encryption (HTTPS/TLS
        # for on-device model-weight downloads). Declaring this up front skips the
        # per-submission encryption prompt in App Store Connect and prevents an
        # accidental mis-answer. Flip to true only if non-exempt crypto is ever added.
        ITSAppUsesNonExemptEncryption: false

  # The iOS shipping shell — the shared adaptive app (2026-07-06). Grew out of the
  # on-device derisk harness into the real, tabbed app (Chat / Memories / Documents
  # / Settings) over the SAME package pipeline the Mac ships (AppCore.swift wires
  # it; the Mac's AppEnvironment is untouched). Voice (AVAudioSession) + the in-app
  # MCP server are the Phase-B/E follow-ons (docs/IOS_VISIONOS_PORT.md). Inherits
  # DEVELOPMENT_TEAM + Automatic signing from the project base, so it provisions to
  # a connected device with no extra config.
  #
  # The visionOS sibling target (M1K3visionOS) shares this exact source list +
  # dependency set — the shell renders as a spatial window; the volumetric-avatar /
  # walkable-constellation flagship is the Phase-D follow. Kept as two XcodeGen
  # targets (one platform each) rather than one multi-platform target so each gets
  # a clean, unambiguous Xcode Cloud archive lane.
  M1K3iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    templates: [MobileShell]
    # Icon Composer (.icon) app icon — the SAME document the Mac target ships.
    # icon.json declares "squares": "shared", so one Icon Composer file authors
    # both the macOS and iOS square icons; referenced as a single file so
    # XcodeGen doesn't recurse into the bundle, and actool compiles it via
    # APPICON_NAME below. This deliberately lives on the target rather than in
    # the MobileShell template: Icon Composer has NO visionOS support (Xcode
    # 26.x), so the visionOS sibling carries a hand-built layered image stack
    # instead. The icon asset is the one thing the two mobile targets can't share.
    sources:
      - path: M1K3.icon
        type: file
        buildPhase: resources
      # Companion shading (Phosphor/Cel) rides RealityKit CustomMaterial surface
      # shaders — macOS/iOS only. Lives on the iOS target (not the shared
      # MobileShell template) because the visionOS SDK ships no RealityKit.h Metal
      # header and no CustomMaterial; the visionOS sibling shows baked textures.
      - path: M1K3App/PhosphorMaterial.swift
      - path: M1K3App/Phosphor.metal
    settings:
      base:
        # ONE App Store record for Mac + iPhone/iPad + Vision Pro (universal
        # purchase). `app.m1k3` is registered UNIVERSAL in the developer portal and
        # the ASC app record already carries IOS + VISION_OS version drafts, so every
        # platform's archive must upload under the SAME identifier — a per-platform
        # suffix (`app.m1k3.ios`, pre-2026-09-02) has no record to land in and fails
        # only at upload, after the full build. Immutable once a build ships.
        # Guarded by tools/ci/check_store_targets.py.
        PRODUCT_BUNDLE_IDENTIFIER: app.m1k3
        # Named like the Mac's product. Xcode derives CFBundleName from PRODUCT_NAME
        # even with an explicit Info.plist (a `CFBundleName` property in the plist
        # lost — verified on the 2026-09-02 archive), and `M1K3iOS` would leak into
        # system dialogs. The scheme stays `M1K3iOS`; only the .app is renamed.
        PRODUCT_NAME: M1K3
        # Increased Memory Limit (entitlement-only; no portal capability) — raises
        # the jetsam budget so the 4 GB mobile MLX ceiling can actually be reached.
        # This is what Lil on an iPhone/iPad stands on.
        CODE_SIGN_ENTITLEMENTS: M1K3iOSApp/M1K3iOS.entitlements
        # ITMS-90474: App Store Connect rejects an iPad-capable upload that
        # declares no orientations (the archive AND export succeed first — run
        # #272 died only at "Preparing build for App Store Connect"). iPad
        # multitasking needs all four; iPhone gets the Xcode-template trio.
        # Build settings, not plist properties: the generated-plist step honours
        # these the same way it derived CFBundleName. Guarded.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: M1K3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.2"
    info:
      path: M1K3iOSApp/Info.generated.plist
      properties:
        CFBundleDisplayName: M1K3
        ITSAppUsesNonExemptEncryption: false
        # Brain at Home discovery: iOS 14+ gates Bonjour BROWSING on this list, on
        # top of NSLocalNetworkUsageDescription. Without it NWBrowser finds nothing
        # and only the QR's `hosts=` dial-in works (the Mac declares it too).
        NSBonjourServices:
          - "_m1k3._tcp"
        NSMicrophoneUsageDescription: "M1K3 uses the microphone for voice conversations. Audio is transcribed on-device and never leaves your device."
        NSSpeechRecognitionUsageDescription: "M1K3 transcribes your speech on-device so you can talk to it. Nothing is sent to Apple or any server."
        NSCameraUsageDescription: "M1K3 uses the camera only to scan the pairing code your Mac shows for Brain at Home. No photos or video are captured or stored."
        NSLocalNetworkUsageDescription: "Brain at Home connects to your own Mac over your Wi-Fi so this device can use its bigger brain. Nothing leaves your network."

  # visionOS sibling — same shell, same portable graph, rendered spatially as a
  # window. The Kokoro visionOS gap (no xrOS ONNX slice) is RESOLVED as of
  # 2026-07-18 — the ONNX Runtime backend was replaced with a pure-MLX one
  # (M1K3Kokoro now links MLX/MLXNN/MLXFFT/MLXFast, which already build for
  # visionOS 26), so M1K3 Voice has no per-platform gap once it's wired into
  # this shell. The Phase-D spatial flagship (volumetric avatar + walkable
  # memory constellation) is the differentiated follow.
  M1K3visionOS:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    templates: [MobileShell]
    # Hand-authored layered app icon. Icon Composer has NO visionOS support as of
    # Xcode 26.x, so the shared M1K3.icon the Mac/iOS targets use CANNOT author
    # this one — visionOS needs a 1-3 layer `.solidimagestack` (each layer a
    # 1024×1024 PNG; the Back layer MUST be fully opaque or actool errors), and
    # the system applies the circular mask + parallax depth itself. Deliberately
    # lives OUTSIDE M1K3iOSApp/ so the template's `- path: M1K3iOSApp` doesn't
    # sweep a vision-idiom asset into the iOS bundle. Regenerated by
    # tools/icons/build_visionos_icon.py from the same wordmark art.
    sources:
      - path: M1K3visionOS/Assets.xcassets
    settings:
      base:
        # Same universal record as the Mac + iOS targets — see M1K3iOS above.
        PRODUCT_BUNDLE_IDENTIFIER: app.m1k3
        PRODUCT_NAME: M1K3
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.2"
    info:
      # Its OWN generated plist (was shared with M1K3iOS — harmless while the two
      # property sets were identical, a silent clobber the moment they diverge).
      # Lives beside the visionOS asset catalog, outside the template's
      # `M1K3iOSApp/` sweep, so the iOS target never bundles it as a stray resource.
      path: M1K3visionOS/Info.generated.plist
      properties:
        CFBundleDisplayName: M1K3
        ITSAppUsesNonExemptEncryption: false
        NSBonjourServices:
          - "_m1k3._tcp"
        NSMicrophoneUsageDescription: "M1K3 uses the microphone for voice conversations. Audio is transcribed on-device and never leaves your device."
        NSSpeechRecognitionUsageDescription: "M1K3 transcribes your speech on-device so you can talk to it. Nothing is sent to Apple or any server."
        NSCameraUsageDescription: "M1K3 uses the camera only to scan the pairing code your Mac shows for Brain at Home. No photos or video are captured or stored."
        NSLocalNetworkUsageDescription: "Brain at Home connects to your own Mac over your Wi-Fi so this device can use its bigger brain. Nothing leaves your network."

  # The M1K3 screensaver (.saver bundle) — "what your machine got up to while you
  # were away". A borderless ScreenSaverView drawing the ambient pixel-rain + the
  # M brand mark; the pure sim/geometry/copy is the M1K3ScreensaverCore package.
  # Chosen over an always-on desktop wallpaper (challenger, 2026-08-20): a
  # screensaver runs only when idle, so cost + the screenshot-privacy bind vanish.
  # Install: build, then copy M1K3.saver to ~/Library/Screen Savers/.
  M1K3Screensaver:
    type: bundle
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: M1K3Screensaver
    dependencies:
      - package: M1K3
        product: M1K3ScreensaverCore
      - sdk: ScreenSaver.framework
    settings:
      base:
        WRAPPER_EXTENSION: saver
        PRODUCT_BUNDLE_IDENTIFIER: app.m1k3.screensaver
        # File is "M1K3.saver" (PRODUCT_NAME) so the installed path + picker read
        # "M1K3" and match ScreenSaverInstall.fileName; the Swift MODULE stays
        # M1K3Screensaver (PRODUCT_MODULE_NAME) so NSPrincipalClass resolves and
        # it doesn't collide with the app's own M1K3 module.
        PRODUCT_NAME: M1K3
        PRODUCT_MODULE_NAME: M1K3Screensaver
        INFOPLIST_FILE: M1K3Screensaver/Info.plist
        # legacyScreenSaver loads a signed bundle; inherit the Round Tower team
        # from base settings, and skip the app-sandbox entitlement (a .saver is a
        # plug-in hosted by the system, not an app).
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks @executable_path/../Frameworks"

# A SHARED M1K3 scheme, explicit so xcodegen emits it to xcshareddata/xcschemes/.
# Without this, Xcode only auto-creates an ephemeral user scheme — invisible to
# Xcode Cloud (which can build only shared schemes). Because the pbxproj is
# gitignored, ci_scripts/ci_post_clone.sh regenerates the project (and this
# scheme) in the cloud, so the Archive→TestFlight workflow can find M1K3.
schemes:
  M1K3:
    build:
      targets:
        M1K3: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # The iOS shell scheme — select this + your iPhone (or a Simulator), then ⌘R.
  M1K3iOS:
    build:
      targets:
        M1K3iOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # The visionOS shell scheme — select this + a Vision Pro (or its Simulator).
  M1K3visionOS:
    build:
      targets:
        M1K3visionOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # The screensaver (.saver) — build, then copy the product to ~/Library/Screen Savers/.
  M1K3Screensaver:
    build:
      targets:
        M1K3Screensaver: all
    run:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
