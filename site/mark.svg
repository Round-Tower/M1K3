<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 28">
  <!-- M1K3 phosphor mark, nav cut: the 5x7 pixel M alone, no tile. The tab icon keeps its tile (favicon.svg). Self-hosted, no CDN. -->
