  <g fill="#ffffff" transform="translate(2 4)">
    <rect x="0" y="0" width="4" height="4"/><rect x="16" y="0" width="4" height="4"/>
    <rect x="0" y="4" width="4" height="4"/><rect x="4" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/>
    <rect x="0" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/>
    <rect x="0" y="12" width="4" height="4"/><rect x="16" y="12" width="4" height="4"/>
    <rect x="0" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/>
  </g>
</svg>
